[package]
name = "octet-tools-extensions-only-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
octet-agent = { path = "../../crates/octet-agent", default-features = false, features = ["tools", "extensions"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
tempfile = "3"
