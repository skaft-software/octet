[variants.dark.roles."surface.tool"]
background = "#1e1e1e"

[variants.dark.roles."surface.shell"]
background = "#1e1e1e"

[variants.dark.roles."surface.user.border"]
foreground = "#d29c54"

[variants.dark.roles."surface.assistant.border"]
foreground = "#2e2e2e"

[variants.dark.roles."surface.reasoning.border"]
foreground = "#2e2e2e"

[variants.dark.roles."surface.tool.border"]
foreground = "#5a5a5a"

[variants.dark.roles."surface.shell.border"]
foreground = "#5a5a5a"

[variants.dark.roles."surface.notice.border"]
foreground = "#2e2e2e"

[variants.dark.roles."surface.outcome.border"]
foreground = "#333333"

[variants.dark.roles."surface.compaction.border"]
foreground = "#2e2e2e"

