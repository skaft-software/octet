# Still — contained, quiet theme for octet.
# Visual direction informed by Grok Build's Apache-2.0 TUI:
# https://github.com/xai-org/grok-build (palette and spacing, not source code).
#
# Full-width content, soft prompt and composer fills, and compact tool
# activity. The tool dots and status remain monochrome; older terminal-owned
# scrollback keeps its original styling.
#
# How the look is built (all theme-file supported):
# - The transcript and composer use the available terminal width. A soft band
#   distinguishes user prompts; tools stay unboxed and tightly stacked.
# - `model.use_lab_color = "true"` keeps the prompt model-adaptive, while the
#   rest of the interface remains quiet and neutral.
# - Syntax stays near-monochrome; signal colours (diff, error, success) are
#   muted rather than neon.
#
# Tool wording/grouping is owned by octet's TUI, not theme files: Still groups
# exploration, edits, web searches/fetches, MCP, and computer-use into quiet rows.
# Delegation keeps its existing subagent presentation; Ctrl+O reveals details.

[metadata]
name = "Still"
description = "A calm, full-width interface with soft prompts and compact activity"
author = "Achu"
version = "1"
terminal = "light-dark"
adaptive = false

[colors]
# Neutral baseline for terminals where background detection is unavailable.
foreground = "default"
muted = "#818a84"
dim = "#737c76"
border = "#414944"
border_idle = "#414944"
border_focused = "#6f9182"
composer = "shaded"
composer_bg = "#242424"
# The startup splash follows the active model family, like the prompt chevron
# and composer marker. It claims the whole splash, so no `splash` colour is set.
splash_model_adaptive = true
# The compact 16x4 startup mark rather than the larger file-theme presentation.
splash_compact = true
# One breathing cell before the marker aligns activity text with padded prompts.
event_marker_gutter = 3
prompt_wash = false
quiet_tool_summaries = true
tool_dot_breathing = true
tool_dot_bright = "#a0a0a0"
tool_dot_dim = "#646464"

# Low-saturation status colors remain distinct without dominating the page.
accent = "#6f9182"
success = "#789b7e"
info = "#839a91"
error = "#b87873"
warning = "#b09261"

# Transcript and diff colors.
user_msg_text = "default"
user_msg_bg = "#242424"
assistant_msg_text = "default"
tool_title = "#aab3ad"
tool_output = "#aab3ad"
diff_added = "#789b7e"
diff_removed = "#b87873"
diff_context = "#818a84"

# Markdown and code: quiet syntax, soft code well.
md_heading = "#6f9182"
md_link = "default"
md_code = "#a9b9b0"
md_code_block = "default"
md_code_border = "#414944"
md_code_bg = "#202723"
md_code_inline_bg = "default"
md_quote = "default"
md_quote_border = "#414944"
md_hr = "#414944"
md_list_bullet = "#818a84"

# Syntax stays near-monochrome; code structure comes from typography first.
syntax_comment = "#737c76"
syntax_keyword = "#b7c2bb"
syntax_function = "#d0d7d2"
syntax_variable = "#b9c3bd"
syntax_string = "#92a996"
syntax_number = "#a8b5ad"
syntax_type = "#aab7af"
syntax_operator = "#a0aaa4"
syntax_punctuation = "#818a84"

# Context report categories retain separate, restrained colors.
context_system = "#789b7e"
context_skills = "#b09261"
context_tools = "#839a91"
context_messages = "#aab3ad"
context_pending = "#b87873"
context_framing = "#818a84"
context_adjustment = "#9a8cab"
context_tokenizer_adjustment = "#aa8796"
context_output = "#b87873"
context_free = "#789b7e"
context_buffer = "#8e8aa8"

# Model-adaptive: the active model family supplies the prompt/composer colour.
# `model_accent` is the fallback when no model family is detected.
model_accent = "#6f9182"
model_assistant = "default"
model.use_lab_color = "true"

[roles."surface.user"]
background = "#242424"

[roles.heading]
foreground = "accent"
bold = true

[roles.strong]
bold = true

[roles.emphasis]
italic = true

[roles.quote]
dim = true

[roles.link]
underline = true

[glyphs]
top_left = "╭"
top_right = "╮"
bottom_left = "╰"
bottom_right = "╯"
horizontal = "─"
vertical = " "
branch = " "
last_branch = " "
rail = " "
prompt = "›"
shell = "$"
success = "·"
warning = "·"
note = "·"
error = "·"
interrupt = "·"
pending = "·"
reasoning = "·"
collapsed = "›"
expanded = "▾"
separator = " · "
ellipsis = "…"
bullet = "•"
wordmark = "octet"

[glyphs_ascii]
top_left = "+"
top_right = "+"
bottom_left = "+"
bottom_right = "+"
horizontal = "-"
vertical = " "
branch = " "
last_branch = " "
rail = " "
prompt = ">"
shell = "$"
success = "."
warning = "."
note = "."
error = "."
interrupt = "."
pending = "."
reasoning = "."
collapsed = ">"
expanded = "v"
separator = " - "
ellipsis = "..."
bullet = "*"
wordmark = "octet"

# Full-width content. Only user prompts have a soft fill; activity remains
# unboxed and condensed, with full details available through Ctrl+O.
[surfaces.user]
chrome = "band"
width = "full"
align = "left"
padding = 1

[surfaces.assistant]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[surfaces.reasoning]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[surfaces.tool]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[surfaces.notice]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[surfaces.outcome]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[surfaces.shell]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[surfaces.compaction]
chrome = "plain"
width = "full"
align = "left"
padding = 0

[layout]
density = "comfortable"
show_header = false
show_footer = true
show_status_line = true
show_reasoning = false
show_panel_borders = false
prompt_padding = false
transcript_inset = 2
composer_padding = 1
narrow_breakpoint = 64
narrow_show_header = false
narrow_show_footer = true
narrow_show_status_line = true
narrow_show_reasoning = false
narrow_show_panel_borders = false

