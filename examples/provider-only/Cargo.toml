[package]
name = "octet-provider-only-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

# Independent workspace: the only Octet dependency below is the AI package.
[workspace]

[dependencies]
octet-ai = { path = "../../crates/octet-ai" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde_json = "1"
tempfile = "3"
base64 = "0.22"
zstd = "0.14.3"
