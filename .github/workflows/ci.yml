name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "false"

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit
      - run: cargo audit --file extensions/octet-serve/Cargo.lock
      - run: cargo deny check
      - run: cargo deny --manifest-path extensions/octet-serve/Cargo.toml check

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test models.dev metadata tooling (offline)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/test_refresh_models_dev_metadata.py
          python3 scripts/test_release_model_metadata_gate.py
      # Check before reviewed release source is frozen, not in build.rs or the
      # signed-release workflows (which use frozen model snapshots).
      - name: Check pre-release model metadata freshness
        timeout-minutes: 2
        env:
          MODEL_METADATA_BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before }}"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check-release-model-metadata.py
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Test binary release tooling
        run: |
          sh -n scripts/install.sh
          bash -n \
            scripts/build-octet-image.sh \
            scripts/package-octet-extension-release.sh \
            scripts/package-octet-release.sh \
            scripts/package-octet-serve-release.sh \
            scripts/test-binary-installer.sh \
            scripts/package-octet-npm.sh \
            scripts/test-octet-npm.sh \
            scripts/test-octet-npm-install.sh \
            scripts/test-homebrew-formula.sh
          python3 -m py_compile scripts/provider-acceptance.py scripts/generate-octet-release-metadata.py scripts/create-octet-npm-manifest.py scripts/verify-octet-npm.py scripts/verify-octet-npm-provenance.py scripts/generate-homebrew-formula.py
          python3 scripts/test_provider_acceptance.py
          python3 scripts/test_repository_identity.py
          version="v$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          while IFS= read -r extension; do
            [[ -n "$extension" ]] || continue
            scripts/package-octet-extension-release.sh \
              "$extension" "$RUNNER_TEMP/extension-bundles" "$version"
            scripts/package-octet-extension-release.sh \
              "$extension" "$RUNNER_TEMP/extension-bundles-repeat" "$version"
            cmp \
              "$RUNNER_TEMP/extension-bundles/$extension-${version#v}.tar.gz" \
              "$RUNNER_TEMP/extension-bundles-repeat/$extension-${version#v}.tar.gz"
          done < <(grep -Ev '^[[:space:]]*(#|$)' extensions/release-catalog.txt)
          scripts/test-binary-installer.sh
          scripts/build-octet-image.sh --context "$RUNNER_TEMP/octet-container-context"
          test "$(cat "$RUNNER_TEMP/octet-container-context/.octet-container-source")" = "$(git rev-parse HEAD)"
          test ! -e "$RUNNER_TEMP/octet-container-context/.git"
      - name: Test performance measurement contracts (no live clients)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/tests -p 'test_bench_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --doc --profile ci-test --locked
      - run: cargo fmt --manifest-path extensions/octet-serve/Cargo.toml -- --check
      - run: cargo clippy --manifest-path extensions/octet-serve/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path extensions/octet-serve/Cargo.toml --profile ci-test --locked
      # Cargo 1.90 stabilized packaging interdependent workspace crates. Keep
      # the dedicated compilation check on the 1.86 MSRV in the job below; use
      # 1.90 only to assemble the publishable crates together. The serve feature depends on the
      # publish-excluded optional extension.
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          toolchain: 1.90.0
      - run: cargo +1.90.0 package --workspace --exclude octet-coding-agent --locked --no-verify

  first-party-extension-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test the shared Python SDK and every official extension adapter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 --version
          PYTHONPATH=sdk/python python3 -m unittest discover -s sdk/python/tests
          while IFS= read -r extension; do
            [[ -n "$extension" ]] || continue
            root="extensions/$extension"
            test -d "$root/tests"
            if [[ -f "$root/tests/__init__.py" ]]; then
              (cd "$root" && python3 -m unittest discover -s tests -t .)
            else
              (cd "$root" && python3 -m unittest discover -s tests)
            fi
          done < <(grep -Ev '^[[:space:]]*(#|$)' extensions/release-catalog.txt)

  extension-api-v03:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify generated API 0.3 artifacts and language conformance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 scripts/generate-extension-api-v03.py --check
          cargo test -p octet-agent --test extension_api_v03_conformance --locked
          cargo test -p octet-agent --lib api_v03_ --locked
          PYTHONPATH=sdk/python python3 -m unittest sdk/python/tests/test_extension_api_v03.py
          node sdk/typescript/tests/api_v03_conformance.mjs
          node sdk/typescript/tests/package_conformance.mjs
          npm ci --prefix apps/web
          apps/web/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo test --workspace --all-targets --all-features --profile ci-test --locked
      - run: cargo check --workspace --all-targets --no-default-features --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo check --workspace --all-targets --all-features --locked

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: apps/web/.node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:fonts
      - run: npm run build
      - run: npm run check:external
      - run: npm run bundle:check
      - run: cargo build -p octet-coding-agent --bin octet --features serve --locked
        working-directory: ${{ github.workspace }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:live

  smoke-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo install --debug --locked --path crates/octet-coding-agent --bins --features serve --root "$RUNNER_TEMP/octet-install"
      - run: "$RUNNER_TEMP/octet-install/bin/octet --version"
      - run: "$RUNNER_TEMP/octet-install/bin/octet --help"
      - name: Smoke-test installed native host
        run: |
          test -x "$RUNNER_TEMP/octet-install/bin/octet-host"
          printf '%s\n' '{"protocol_version":1,"request_id":"ci-smoke","command":"hello"}' \
            | "$RUNNER_TEMP/octet-install/bin/octet-host" \
            | grep -F '"type":"hello"' >/dev/null
      - run: scripts/smoke-octet-serve-installed.sh "$RUNNER_TEMP/octet-install/bin/octet"
