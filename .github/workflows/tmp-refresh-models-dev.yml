# Temporary: regenerates models.dev snapshots with the reviewed refresh script
# on a runner that can reach models.dev. Removed before the repair PR.
name: tmp-refresh-models-dev

on:
  push:
    branches:
      - claude/dazzling-brahmagupta-70msv8
    paths:
      - .github/workflows/tmp-refresh-models-dev.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Refresh models.dev snapshots
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/refresh-models-dev-pricing.py
          python3 scripts/refresh-models-dev-pricing.py --check
          cat crates/octet-ai/models/models-dev-source.json
          git diff --stat
      - name: Commit regenerated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/octet-ai/models/models-dev-pricing.json \
            crates/octet-ai/models/models-dev-names.json \
            crates/octet-ai/models/models-dev-capabilities.json \
            crates/octet-ai/models/models-dev-source.json
          git commit -m "Refresh models.dev metadata snapshots

          Regenerated by scripts/refresh-models-dev-pricing.py in Actions run
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          git push origin HEAD:claude/dazzling-brahmagupta-70msv8
