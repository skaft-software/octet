name: Bug or regression
description: Report reproducible incorrect behavior in a supported octet path.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never include credentials, private prompts, repository contents, or unredacted session files. If this may be a vulnerability, stop and use private security reporting instead.
  - type: textarea
    attributes:
      label: In your own words
      description: 1–3 sentences written or explicitly approved by the human about why this matters. Agents must never invent or paraphrase this as the human's words.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Searched existing issues
      description: Check [issues](https://github.com/skaft-software/octet/issues?q=is%3Aissue), [PRs](https://github.com/skaft-software/octet/pulls?q=is%3Apr) (including closed), and documentation first.
      options:
        - label: I searched open and closed issues and PRs, and documentation, for the same behavior.
          required: true
  - type: textarea
    attributes:
      label: Search results and related work
      description: Link related issues, PRs or docs and say what you found, or state no match.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Intake checks
      options:
        - label: I reproduced this on the current supported release or a named commit.
          required: true
        - label: This report does not disclose a suspected security vulnerability.
          required: true
  - type: input
    attributes:
      label: octet version or commit
      placeholder: octet 0.7.0 or a full commit SHA
    validations:
      required: true
  - type: input
    attributes:
      label: Platform
      placeholder: macOS 15 arm64, Ubuntu 24.04 x86_64, terminal name/version
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Surface
      options:
        - TUI / terminal rendering
        - Agent / tools / sessions
        - Provider / model / authentication
        - Extensions / MCP / Pi compatibility
        - octet Serve
        - Install / update / release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
      description: State the observable behavior and impact. Redact paths and private data where possible.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Include the smallest deterministic steps, configuration shape with values removed, and whether it reproduces after restart.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized evidence
      description: Paste only bounded, inspected diagnostics. Do not attach credentials, prompts, tool arguments/results, private repository data, or raw sessions.
  - type: textarea
    attributes:
      label: Additional context
      description: Note workarounds, frequency, regressions from a prior version, or related issues.
  - type: textarea
    attributes:
      label: AI provenance
      description: Optional — tool/agent, exact model name or ID (including fine-tunes and uncensored or abliterated variants), reasoning effort; "not exposed" for unavailable details, or "none" for no AI assistance.
    validations:
      required: false
