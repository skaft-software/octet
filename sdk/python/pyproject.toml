[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "octet-extension-sdk"
version = "0.7.0"
description = "Dependency-free Python SDK for octet executable extensions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Skaft Software"}]
keywords = ["octet", "extension", "json-rpc"]

[tool.setuptools.packages.find]
where = ["."]
include = ["octet_extension*"]
