[workspace]
resolver = "2"
members = ["."]
exclude = ["host-check"]

[package]
name = "octet-extension"
version = "0.8.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Tool-only API 0.4 executable-extension authoring runtime for octet"
publish = false
autotests = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
schemars = "=0.8.22"

[[example]]
name = "native-hello"
path = "../../examples/extensions/native-hello/rust/main.rs"

[[example]]
name = "native-probe"
path = "tests/probe.rs"

[profile.release]
panic = "unwind"
