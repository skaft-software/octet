# Test-only companion: real source host, not linked into author executables.
[workspace]
resolver = "2"

[package]
name = "octet-native-host-check"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
octet-agent = { path = "../../../crates/octet-agent" }
octet-ai = { path = "../../../crates/octet-ai" }
serde_json = "=1.0.150"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tempfile = "3"
wiremock = "=0.6.5"
