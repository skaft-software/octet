[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
# Dependency path: octet-coding-agent -> sexy-tui-rs -> syntect 5.3 -> bincode
# 1.3.3. This advisory is an unmaintained warning, not a vulnerability. octet
# invokes only `SyntaxSet::load_defaults_newlines`, which decodes syntect's
# compile-time embedded syntax dump; no session, extension, workspace, or other
# attacker-supplied bytes reach bincode. Removal plan: upgrade when syntect
# migrates its default-syntax dump off bincode 1, or replace `default-syntaxes`
# with a octet-built trusted SyntaxSet if upstream does not migrate.
ignore = [
  # Indirectly pulled by lopdf 0.42.0 for PDF font parsing. This is an
  # unmaintained warning, not a known vulnerability; no newer lopdf release
  # removes the dependency yet. Reassess on every lopdf upgrade or when
  # lopdf adopts an actively maintained replacement.
  "RUSTSEC-2026-0192",
  "RUSTSEC-2025-0141",
  # Dependency path: octet-coding-agent -> serde_yaml 0.9 -> unsafe-libyaml
  # 0.2.11. This advisory is an unmaintained warning, not a vulnerability.
  # serde_yaml parses only prompt-template and skill frontmatter, each capped
  # at 32 KiB before parsing and decoded into fixed structs. Removal plan:
  # move both call sites to a safe-Rust YAML parser (serde-saphyr) after
  # 0.9.0, with Pi frontmatter fixtures pinning parity.
  "RUSTSEC-2024-0449",
  # Dependency path: octet-ai -> tokio-tungstenite 0.29 (rustls-tls-webpki-roots)
  # -> webpki-roots 0.26.11. That release is a semver shim whose only item is
  # `pub use webpki_roots_1::TLS_SERVER_ROOTS`, so it serves the roots of the
  # webpki-roots 1.x in Cargo.lock, which is at the fixed 1.0.10. No 0.26 release
  # carries the fix and every tokio-tungstenite release requires ^0.26. The ID
  # also covers 1.x, so scripts/tests/test_advisory_exceptions.py fails if the
  # 1.x lock drops below 1.0.10 or the shim stops being the only 0.26 entry.
  # Removal plan: drop when tokio-tungstenite depends on webpki-roots 1.
  "RUSTSEC-2026-0381",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # Mozilla's reviewed root-certificate bundle is a runtime trust store.
  "CDLA-Permissive-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
