name = "octet-web-search"
version = "0.9.6"
api_version = "0.4"
requires_octet = "=0.9.6"
description = "Selectable Brave Search or SearXNG web search with bounded public-page retrieval and stable citations"

[entrypoint]
command = "extension.py"

[capabilities]
# The runtime manages ~/.config/octet/octet-web-search.json and an owner-private
# Brave API key under ~/.octet/credentials; both fixed user paths are outside the
# active workspace.
filesystem = "unrestricted"
process = false
network = true
# Windows resolves the home directory (Path.home()) from USERPROFILE; without
# it the runtime cannot locate its configuration and fails before initialize.
environment = ["APPDATA", "LOCALAPPDATA", "USERPROFILE"]

[contributes]
tools = ["web_search", "web_fetch", "web_find"]
commands = ["web-search"]
ui = ["status"]
presentation = true
menu = true
