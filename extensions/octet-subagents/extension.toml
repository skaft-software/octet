name = "octet-subagents"
version = "0.9.6"
api_version = "0.4"
requires_octet = "=0.9.6"
description = "Run and resume background Octet assistants with explicit tool permissions"

[entrypoint]
command = "octet-subagents"

[capabilities]
# The extension process itself does not read the workspace, launch processes, or
# use the network. Child permissions are inherited and enforced by octet's
# agent_sessions service; this declaration does not pretend the shared cwd is an
# isolation boundary.
filesystem = "none"
process = false
network = false

[contributes]
tools = ["subagent_models", "subagent_spawn", "subagent_status", "subagent_wait", "subagent_stop", "subagent_continue"]
commands = ["subagents"]
ui = ["status"]
presentation = true
menu = true
