name = "octet-computer-use"
version = "0.9.0"
api_version = "0.4"
requires_octet = "=0.9.0"
description = "Native computer use through Cua Driver with window-scoped cursor feedback and Octet's effect-confirmation policy"

[entrypoint]
command = "extension.py"

[capabilities]
# Provisioning installs the MIT-licensed `cua-driver` distribution from the
# configured package index into octet-owned state under ~/.octet/computer-use.
# Default macOS setup also installs Cua's verified signed host from its tagged
# release under that same root, without replacing a global application.
# The driver is then launched as a child process to read the desktop and to act
# on it, which necessarily requires filesystem and process authority.
filesystem = "unrestricted"
process = true
network = true
# The driver reaches the interactive desktop session only through these
# reviewed, non-secret session variables. None is a credential, and none is
# forwarded unless the host and the bundle both declare it. The bundle strips
# everything else, so provider tokens and arbitrary ambient variables never
# reach the child. The desktop-identity names (XDG_CURRENT_DESKTOP,
# XDG_SESSION_DESKTOP, DESKTOP_SESSION, KDE_FULL_SESSION) and compositor IPC
# names (HYPRLAND_INSTANCE_SIGNATURE, SWAYSOCK) let the Linux driver pick its
# GNOME, KDE, Hyprland, or Sway route and give launched apps their desktop
# identity. XDG_STATE_HOME locates the driver's own state.
environment = [
  "DISPLAY",
  "WAYLAND_DISPLAY",
  "XDG_RUNTIME_DIR",
  "XDG_SESSION_TYPE",
  "XDG_DATA_HOME",
  "XDG_DATA_DIRS",
  "XDG_CONFIG_HOME",
  "DBUS_SESSION_BUS_ADDRESS",
  "XAUTHORITY",
  "XDG_CURRENT_DESKTOP",
  "XDG_SESSION_DESKTOP",
  "DESKTOP_SESSION",
  "XDG_STATE_HOME",
  "KDE_FULL_SESSION",
  "HYPRLAND_INSTANCE_SIGNATURE",
  "SWAYSOCK",
  "APPDATA",
  "LOCALAPPDATA",
  "USERPROFILE",
  "SYSTEMROOT",
  "WINDIR",
]

[contributes]
tools = [
  "computer_use_status",
  "computer_use_setup",
  "computer_use_installed_apps",
  "computer_use_windows",
  "computer_use_window_state",
  "computer_use_desktop_state",
  "computer_use_click",
  "computer_use_type_text",
  "computer_use_press_key",
  "computer_use_hotkey",
  "computer_use_invoke_menu",
  "computer_use_move_cursor",
  "computer_use_scroll",
  "computer_use_launch_app",
  "computer_use_start_session",
  "computer_use_end_session",
  "computer_use_jev_status",
  "computer_use_jev_choose",
  "computer_use_jev_use_status",
  "computer_use_jev_use_cancel",
  "computer_use_jev_use_setup",
  "computer_use_jev_use_run",
  "computer_use_jev_use_choose",
]
commands = ["computer-use"]
ui = ["status"]
hooks = ["session_end"]
confirmations = true
menu = true
