name = "octet-import-aider"
version = "0.1.0"
api_version = "0.3"
requires_octet = "=0.8.0"
description = "Bounded, source-only Aider migration adapter"

[entrypoint]
command = "extension.py"

[capabilities]
filesystem = "workspace"
process = false
network = false

[contributes]
# API 0.3 migration methods are negotiated by the executable, not manifest tools.
tools = []
