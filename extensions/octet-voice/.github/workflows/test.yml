name: Provider-free tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      host_target:
        description: 'Auto-select PR/tag, or explicitly test candidate, tag, or published release'
        type: choice
        options: [auto, candidate, tag, release]
        default: auto
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Explicit locked dependency setup
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test extension (no devices or provider calls)
        env:
          PYTHONPATH: vendor
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -Werror::ResourceWarning -m unittest discover -s . -q
      - name: Test vendored SDK
        env:
          PYTHONPATH: vendor
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -Werror::ResourceWarning -m unittest discover -s tests/sdk -q
      - name: Build source-only bundle
        run: python build-package.py stage --archive dist/octet-voice-0.10.0.tar.gz
  host-compat:
    name: Linux candidate-host compatibility (provider-free)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.host.outputs.commit }}
      target: ${{ steps.host.outputs.target }}
    env:
      HOST_TARGET: ${{ inputs.host_target || 'auto' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Resolve exact public host source
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(python scripts/resolve_host.py "$HOST_TARGET")
          printf 'commit=%s\ntarget=%s\n' "$commit" "$HOST_TARGET" >> "$GITHUB_OUTPUT"
      - name: Check out exact host source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: skaft-software/octet
          ref: ${{ steps.host.outputs.commit }}
          path: host
          persist-credentials: false
      # Match octet's release compiler, independent of its workspace MSRV.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      - name: Build and identify host
        env:
          EXPECTED_HOST_COMMIT: ${{ steps.host.outputs.commit }}
          CARGO_BUILD_JOBS: '1'
        run: |
          set -euo pipefail
          test "$(git -C host rev-parse HEAD)" = "$EXPECTED_HOST_COMMIT"
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          cargo build --manifest-path host/Cargo.toml --release --locked -p octet-coding-agent --bin octet
      - name: Provision locked voice dependencies
        run: |
          python -m venv "$RUNNER_TEMP/voice-venv"
          "$RUNNER_TEMP/voice-venv/bin/python" -m pip install --require-hashes -r requirements.lock
      - name: Exercise installed bundle without audio or provider calls
        run: |
          python scripts/host-smoke.py \
            --host host/target/release/octet --venv "$RUNNER_TEMP/voice-venv"
  package:
    name: Experimental source-only bundle
    needs: [test, host-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Check host source has not moved during qualification
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_TARGET: ${{ needs.host-compat.outputs.target }}
          HOST_COMMIT: ${{ needs.host-compat.outputs.commit }}
        run: test "$(python scripts/resolve_host.py "$HOST_TARGET")" = "$HOST_COMMIT"
      - name: Build reproducible bundle and provenance
        env:
          HOST_TARGET: ${{ needs.host-compat.outputs.target }}
          HOST_COMMIT: ${{ needs.host-compat.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python build-package.py stage --archive dist/octet-voice-0.10.0.tar.gz
          python build-package.py stage-repeat --archive repeat/octet-voice-0.10.0.tar.gz
          cmp dist/octet-voice-0.10.0.tar.gz repeat/octet-voice-0.10.0.tar.gz
          (cd dist && sha256sum octet-voice-0.10.0.tar.gz > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          printf '%s\n' "$HOST_COMMIT" > dist/OCTET_HOST_COMMIT
          printf '%s\n' "$HOST_TARGET" > dist/OCTET_HOST_TARGET
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: octet-voice-0.10.0-experimental
          path: dist/
          if-no-files-found: error
          retention-days: 30
