name = "octet-mcp"
version = "0.7.3"
api_version = "0.2"
requires_octet = "=0.7.3"
description = "Resident bridge for explicit MCP tools/resources, private authentication and experimental HTTP"

[entrypoint]
command = "octet-mcp"

[capabilities]
filesystem = "unrestricted"
process = true
network = true

[contributes]
commands = ["mcp"]
hooks = ["before_prompt"]
ui = ["status"]
confirmations = true
presentation = true
