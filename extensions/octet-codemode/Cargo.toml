[package]
name = "octet-codemode"
version = "0.9.0"
edition = "2021"
publish = false
license = "MIT"
description = "No-Node JavaScript tool composition: one Rust executable embedding the vendored QuickJS-WASI engine and Pi's codemode prelude"

# Deliberately not a member of Octet's release workspace: the extension ships
# its own locked dependency closure and is built from its own directory.
[workspace]

[dependencies]
anyhow = "=1.0.103"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
libc = "=0.2.186"
wasmi = { version = "=0.47.2", default-features = false, features = ["std"] }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", features = ["io-util", "io-std", "macros", "rt", "process", "signal", "sync", "time"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
tempfile = "=3.27.0"

[profile.dev]
debug = 0
incremental = false
opt-level = 1

[profile.release]
debug = 0
strip = true
incremental = false
