[package]
name = "octet-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provider-independent inference, authentication and model routing."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ai", "llm", "openai", "anthropic", "inference"]
categories = ["api-bindings"]

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
http = "1"
bytes = { version = "1", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
fancy-regex = "0.16.2"
# Image input is validated and resized before it becomes durable chat history.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
async-stream = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
async-trait = "0.1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
base64 = "0.22"
mime = "0.3"
sha2 = "0.10"
zstd = "0.14.3"

anyhow = "1"
dirs = "5"
fs2 = "0.4"
getrandom = "0.4"
tempfile = "3"
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
url = "2"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "=0.6.5"
pretty_assertions = "1"
